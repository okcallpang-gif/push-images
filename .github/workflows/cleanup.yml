# 매일 한 번: images/<업로드날짜>/ 폴더 중 30일 지난 것을 지운다(일반 커밋).
name: cleanup-old-images

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete folders older than 30 days
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d)
          for d in images/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            if [[ "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$name" < "$cutoff" ]]; then
              echo "remove $name"
              git rm -r -q "$d"
            fi
          done
          if git diff --cached --quiet; then echo "nothing to remove"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "cleanup: remove images older than 30 days ($(date -u +%Y-%m-%d))"
          git push
